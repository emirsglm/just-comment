<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Just Comment promo tile</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
  body { margin: 0; background: #EDEFF3; }
  /* Inverted lockup on ink; one accent. */
  #tile {
    width: 440px; height: 280px; box-sizing: border-box; padding: 36px;
    display: flex; flex-direction: column; justify-content: center; gap: 18px;
    background: #16110D; color: #FFFFFF;
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 64px; height: 64px; flex: none; }
  h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  p { margin: 0; font-size: 18px; line-height: 1.4; color: #DDE1E8; }
  .row { display: flex; gap: 8px; align-items: center; }
  .chip { font: 500 12px/1.3 "IBM Plex Mono", ui-monospace, monospace; color: #16110D; background: #FFC53D; border-radius: 4px; padding: 3px 7px; }
  .note { font-size: 13px; color: #DDE1E8; }
</style>
</head>
<body>
  <div id="tile">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect width="48" height="48" rx="12" fill="#FF5C1A"/>
        <rect x="9" y="9" width="22" height="22" rx="7" stroke="#16110D" stroke-width="3"/>
        <rect x="18.5" y="18.5" width="23" height="23" rx="8.5" fill="#FF5C1A"/>
        <rect x="21" y="21" width="18" height="18" rx="6" fill="#16110D"/>
      </svg>
      <h1>Just Comment</h1>
    </div>
    <p>Point, click, comment.<br>Screenshots &amp; notes for web testing.</p>
    <div class="row"><span class="chip">100% local</span><span class="note">no network requests</span></div>
  </div>
</body>
</html>
